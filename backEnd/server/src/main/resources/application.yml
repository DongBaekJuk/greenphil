server:
  port: ${PORT:8080}

spring:
  application:
    name: greenphil-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/greenphil}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  auth:
    # Set to false in deployed environments and provide jwt-issuer.
    dev-mode: ${AUTH_DEV_MODE:true}
    jwt-issuer: ${SUPABASE_JWT_ISSUER:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
